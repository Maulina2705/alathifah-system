# ==============================================================================
# AL-ATHIFAH e-Rapor: Hardened Nginx Production Server Configuration
# ==============================================================================
# Rekomendasi lokasi file: /etc/nginx/sites-available/alathifah.conf

# 1. Rate Limiting Zone untuk membatasi serangan DDoS / Brute Force
limit_req_zone $binary_remote_addr zone=alathifah_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=alathifah_general_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name raport.alathifah.sch.id; # Ganti dengan domain sekolah Anda

    # Paksa redirect seluruh traffic HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raport.alathifah.sch.id; # Ganti dengan domain sekolah Anda

    # Document Root WAJIB mengarah ke folder /public, BUKAN root project!
    root /var/www/alathifah/public;
    index index.php index.html;

    # Karakter set default
    charset utf-8;

    # Batasi ukuran upload (Maksimal 12MB untuk file Excel/Rapor)
    client_max_body_size 12M;
    client_body_buffer_size 128k;

    # SSL TLS Tuning (Modern & Aman)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Log file
    access_log /var/log/nginx/alathifah_access.log;
    error_log /var/log/nginx/alathifah_error.log warn;

    # Matikan info versi server Nginx (Anti Banner Grabbing)
    server_tokens off;

    # HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Terapkan rate limit umum
    limit_req zone=alathifah_general_limit burst=50 nodelay;

    # Rate limiting khusus endpoint login untuk mencegah brute force
    location = /login {
        limit_req zone=alathifah_login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blokir akses langsung ke seluruh file titik (hidden files: .env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir akses ke file cadangan atau konfigurasi
    location ~* \.(env|log|sql|sqlite|bak|yml|yaml|json|lock|md|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Mencegah eksekusi script PHP liar di folder storage / upload
    location ~* /storage/.*\.php$ {
        deny all;
    }

    # Cache statis asset (CSS, JS, Fonts, Gambar)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Processor
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock; # Sesuaikan versi PHP Anda
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
